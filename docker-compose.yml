services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mariageplusdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mariageplusdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mariageplusdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: change-this-mariageplus-secret-key-32-bytes-min
      SERVER_PORT: 8000
      # URL publique du front web (liens d'invitation envoyés aux invités)
      FRONTEND_URL: ${FRONTEND_URL:-https://eventiaeasy.vercel.app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://eventiaeasy.vercel.app}
    ports:
      - "8000:8000"

volumes:
  db-data:
