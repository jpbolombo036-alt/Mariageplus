<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <title>Invitation</title>
</head>
<body style="font-family: Georgia, serif; color: #333; line-height: 1.5; max-width: 560px; margin: 0 auto; padding: 24px;">
    <p>Bonjour <span th:text="${guestFirstName}">Invité</span>,</p>
    <p>
        Vous êtes cordialement invité(e) au mariage de
        <strong th:text="${weddingDisplayName}">les mariés</strong>.
    </p>

    <div th:if="${eventDate != null}"
         style="margin: 20px 0; padding: 16px; background: #f7f1f3; border-radius: 6px;">
        <div th:if="${eventName}" style="font-weight: bold;" th:text="${eventName}">Cérémonie</div>
        <div th:text="${eventDate}">12 septembre 2026</div>
        <div th:if="${eventStartTime}" th:text="'à ' + ${eventStartTime}">à 14h00</div>
        <div th:if="${eventVenue}" th:text="${eventVenue}">Lieu</div>
    </div>

    <p th:if="${invitationMessage}" style="white-space: pre-line;" th:text="${invitationMessage}"></p>

    <p>Merci de confirmer votre présence en ouvrant le lien ci-dessous :</p>
    <p style="margin: 28px 0;">
        <a th:href="${publicInviteUrl}"
           style="background: #6b3a4a; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 4px;">
            Répondre à l'invitation
        </a>
    </p>
    <p style="font-size: 13px; color: #666;">
        Si le bouton ne fonctionne pas, copiez cette adresse :<br/>
        <span th:text="${publicInviteUrl}"></span>
    </p>
    <p>Avec toute notre affection.</p>
</body>
</html>
