<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${page.weddingDisplayName} + ' — Invitation'">Invitation</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, 'Times New Roman', serif; color: #43302b; margin: 0;
            background: linear-gradient(160deg, #f6efe6 0%, #efe3d3 100%);
            line-height: 1.6; padding: 8px;
        }
        .card {
            max-width: 560px; margin: 32px auto; background: #fffdf8; border-radius: 14px;
            overflow: hidden; box-shadow: 0 10px 36px rgba(80,50,20,0.14);
            border: 1px solid #e8d9bf;
        }
        .ornament-top, .ornament-bottom {
            height: 6px; background: linear-gradient(90deg, #c9a227, #e6c878, #c9a227);
        }
        .hero { text-align: center; padding: 36px 24px 8px; position: relative; }
        .hero img.photo {
            width: 100%; max-height: 320px; object-fit: cover; border-radius: 10px;
            border: 3px solid #e6c878; box-shadow: 0 4px 16px rgba(80,50,20,0.12);
        }
        .monogram {
            width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
            border: 2px solid #c9a227; color: #a8842c; display: flex; align-items: center;
            justify-content: center; font-size: 24px; font-style: italic; letter-spacing: 2px;
            background: #fdf6e7;
        }
        .names {
            font-size: 30px; font-weight: bold; letter-spacing: 1px; margin: 10px 0 4px;
            color: #5a3a2e;
        }
        .divider {
            display: flex; align-items: center; gap: 10px; justify-content: center; margin: 10px auto;
            max-width: 320px; color: #c9a227;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ddc98f; }
        .greeting { font-size: 16px; margin-top: 6px; color: #8a6a52; font-style: italic; }
        .detail { padding: 10px 24px; text-align: center; }
        .detail .row { color: #7d5f4a; margin-top: 2px; font-size: 15px; }
        .detail .row.event-name {
            font-size: 18px; color: #a8842c; letter-spacing: 2px; text-transform: uppercase;
            margin-bottom: 4px;
        }
        .message {
            padding: 18px 30px; white-space: pre-line; color: #5f4636; font-style: italic;
            text-align: center; position: relative;
        }
        .message::before { content: '❝'; display: block; color: #d9b95c; font-size: 22px; }
        .rsvp { padding: 8px 24px 40px; text-align: center; }
        .accepted, .declined {
            display: inline-block; padding: 12px 24px; margin: 8px; border: none;
            border-radius: 8px; font-size: 15px; cursor: pointer; color: #fff;
            text-decoration: none; font-family: inherit; letter-spacing: .5px;
        }
        .accepted { background: linear-gradient(135deg, #6d3b2f, #8a5138); box-shadow: 0 4px 12px rgba(109,59,47,.3); }
        .declined { background: #b3a08e; }
        .count { margin: 12px auto 0; padding: 8px; border: 1px solid #ddc98f; border-radius: 8px; max-width: 200px; background: #fdf6e7; }
        .status { margin-top: 16px; font-size: 15px; color: #a8842c; letter-spacing: 1px; }
        .note { font-size: 12px; color: #b39f8b; margin-top: 8px; }
    </style>
</head>
<body>
<div class="theme-switcher">
    <label for="theme-select">Thème de l'invitation :</label>
    <select id="theme-select">
        <option value="classique">Classique (or &amp; ivoire)</option>
        <option value="royal">Royal (bordeaux)</option>
        <option value="moderne">Moderne (bleu nuit)</option>
        <option value="botanique">Botanique (vert)</option>
        <option value="rose">Rose poudré</option>
        <option value="minuit">Minuit (noir &amp; or)</option>
    </select>
</div>
<div class="card">
    <div class="ornament-top"></div>
    <div class="hero">
        <div class="monogram" th:text="${page.weddingDisplayName} != null ?
            (${#strings.length(page.weddingDisplayName) > 0} ? '♥' : '♥') : '♥'">♥</div>
        <img th:if="${page.couplePhotoUrl}" class="photo" th:src="${page.couplePhotoUrl}" alt="Couple"/>
        <div class="names" th:text="${page.weddingDisplayName}">Groom &amp; Bride</div>
        <div class="divider">✦</div>
        <div class="greeting" th:text="'Bonjour ' + ${page.guestFirstName} + ','">Bonjour,</div>
    </div>

    <div class="detail" th:if="${page.eventDate}">
        <div class="row event-name" th:text="${page.eventName}">Cérémonie</div>
        <div class="row" th:text="${page.eventDate}">12 septembre 2026</div>
        <div class="row" th:if="${page.eventStartTime}" th:text="'à ' + ${page.eventStartTime}">à 14h00</div>
        <div class="row" th:if="${page.eventVenue}" th:text="${page.eventVenue}">Lieu</div>
        <div class="divider">✦</div>
    </div>

    <div class="message" th:if="${page.message}" th:text="${page.message}"></div>

    <div class="rsvp" th:if="${page.canRespond}">
        <form method="post" th:action="@{/invitations/{token}/rsvp(token=${page.token})}">
            <div>
                <button class="accepted" type="submit" name="status" value="ACCEPTED">✅ J'accepte avec plaisir</button>
                <button class="declined" type="submit" name="status" value="DECLINED">❌ Je décline</button>
            </div>
            <div class="count" th:if="${page.rsvpStatus} == 'ACCEPTED'">
                <select name="numberOfAttendees" class="count">
                    <option th:each="i : ${#numbers.sequence(1, page.maxAccepted)}"
                            th:value="${i}"
                            th:selected="${i} == ${page.rsvpNumberOfAttendees}">[[${i}]]</option>
                </select>
            </div>
            <div class="status" th:if="${page.rsvpStatus} != null" th:text="${page.rsvpStatus}"></div>
        </form>

        <div class="note" th:if="${page.maxAccepted} > 1"
             th:text="'(Vous + ' + (${page.maxAccepted} - 1) + ' accompagnant(s))'">(vous + accompagnants)</div>
        <div class="note">Vous pourrez modifier votre réponse à tout moment avant le grand jour.</div>
    </div>
</div>
<div class="ornament-bottom" style="max-width:560px;margin:0 auto 24px;border-radius:0 0 14px 14px;"></div>
<style id="theme-overrides">
    /* Système de thèmes — surcharge les couleurs par défaut ( Classique or/ivoire ) */
    :root, [data-theme="classique"] {
        --t-accent: #c9a227; --t-accent-soft: #fdf6e7; --t-accent-line: #ddc98f;
        --t-bg1: #f6efe6; --t-bg2: #efe3d3;
        --c-btn: linear-gradient(135deg, #6d3b2f, #8a5138); --c-btn-shadow: rgba(109,59,47,.3);
    }
    [data-theme="royal"] {
        --t-accent: #8e5a3c; --t-accent-soft: #fbf1e4; --t-accent-line: #d8b894;
        --t-bg1: #f8ede2; --t-bg2: #efdccb;
        --c-btn: linear-gradient(135deg, #5e2b28, #8e5a3c); --c-btn-shadow: rgba(94,43,40,.3);
    }
    [data-theme="moderne"] {
        --t-accent: #2e4470; --t-accent-soft: #eef2f9; --t-accent-line: #b8c4dd;
        --t-bg1: #f4f6fb; --t-bg2: #e6ebf5;
        --c-btn: linear-gradient(135deg, #22355c, #2e4470); --c-btn-shadow: rgba(34,53,92,.3);
    }
    [data-theme="botanique"] {
        --t-accent: #3f6b4f; --t-accent-soft: #f0f4ec; --t-accent-line: #bcd0b9;
        --t-bg1: #f5f7f0; --t-bg2: #e8efe4;
        --c-btn: linear-gradient(135deg, #335a40, #3f6b4f); --c-btn-shadow: rgba(51,90,64,.3);
    }
    [data-theme="rose"] {
        --t-accent: #b9808a; --t-accent-soft: #fbf0f2; --t-accent-line: #e5c0c8;
        --t-bg1: #fbf2f3; --t-bg2: #f4e3e7;
        --c-btn: linear-gradient(135deg, #9c6a73, #b9808a); --c-btn-shadow: rgba(156,106,115,.3);
    }
    [data-theme="minuit"] {
        --t-accent: #d4af37; --t-accent-soft: #1e1e28; --t-accent-line: #6b5a2a;
        --t-bg1: #14141c; --t-bg2: #1e1e28;
        --c-btn: linear-gradient(135deg, #b8912a, #d4af37); --c-btn-shadow: rgba(212,175,55,.3);
    }
    /* Le thème Minuit inverse texte / fond */
    [data-theme="minuit"] body { color: #e8e2d4 !important; background: linear-gradient(160deg, var(--t-bg1), var(--t-bg2)) !important; }
    [data-theme="minuit"] .card { background: #262633 !important; border-color: #6b5a2a !important; }
    [data-theme="minuit"] .names { color: #f0e6c8 !important; }
    [data-theme="minuit"] .greeting, [data-theme="minuit"] .detail .row,
    [data-theme="minuit"] .message { color: #cfc6b0 !important; }
    [data-theme="minuit"] .monogram { background: #2f2f3d !important; color: var(--t-accent) !important; border-color: var(--t-accent) !important; }
    [data-theme="minuit"] .count { background: #2f2f3d !important; border-color: #6b5a2a !important; }
    [data-theme="minuit"] .note { color: #9a917c !important; }

    /* Application générique des variables de thème */
    body { background: linear-gradient(160deg, var(--t-bg1), var(--t-bg2)) !important; }
    .ornament-top, .ornament-bottom { background: linear-gradient(90deg, var(--t-accent), var(--t-accent-line), var(--t-accent)) !important; }
    .hero img.photo { border-color: var(--t-accent-line) !important; }
    .monogram { border-color: var(--t-accent) !important; color: var(--t-accent) !important; background: var(--t-accent-soft) !important; }
    .divider, .divider::before, .divider::after { color: var(--t-accent) !important; background: var(--t-accent-line) !important; }
    .detail .row.event-name, .status { color: var(--t-accent) !important; }
    .message::before { color: var(--t-accent) !important; }
    .accepted { background: var(--c-btn) !important; box-shadow: 0 4px 12px var(--c-btn-shadow) !important; }
    .declined { background: #b3a08e !important; }
    .count { border-color: var(--t-accent-line) !important; background: var(--t-accent-soft) !important; }
    .theme-switcher {
        max-width: 560px; margin: 0 auto 20px; padding: 10px 16px; text-align: center;
        background: rgba(255,255,255,.75); border-radius: 10px; border: 1px solid var(--t-accent-line);
    }
    .theme-switcher label { font-size: 13px; color: #6d5a45; margin-right: 8px; }
    .theme-switcher select {
        padding: 6px 10px; border-radius: 8px; border: 1px solid var(--t-accent-line);
        font-family: inherit; font-size: 14px; background: #fff; color: #43302b;
    }
    [data-theme="minuit"] .theme-switcher { background: #262633; border-color: #6b5a2a; }
    [data-theme="minuit"] .theme-switcher label, [data-theme="minuit"] .theme-switcher select { color: #e8e2d4; background: #2f2f3d; }
</style>
<script>
(function () {
    var THEMES = ['classique', 'royal', 'moderne', 'botanique', 'rose', 'minuit'];
    var DEFAULT = 'classique';
    var params = new URLSearchParams(window.location.search);
    var theme = (params.get('theme') || '').toLowerCase();
    if (THEMES.indexOf(theme) === -1) theme = DEFAULT;
    document.documentElement.setAttribute('data-theme', theme);
    window.addEventListener('DOMContentLoaded', function () {
        var sel = document.getElementById('theme-select');
        if (!sel) return;
        sel.value = theme;
        sel.addEventListener('change', function () {
            var url = new URL(window.location.href);
            url.searchParams.set('theme', sel.value);
            window.location.href = url.toString();
        });
    });
})();
</script>
</body>
</html>
