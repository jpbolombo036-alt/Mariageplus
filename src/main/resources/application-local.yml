# Profil local : base H2 en mémoire, migrations Flyway actives, h2-console et debug ouverts.
spring:
  datasource:
    url: jdbc:h2:mem:mariageplus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: local-mariageplus-secret-key-32bytes-minimum!!
    expiration: 900000
    refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:true}
    init-email: ${ADMIN_INIT_EMAIL:admin@mariageplus.com}
    init-password: ${ADMIN_INIT_PASSWORD:Admin@12345}

logging:
  level:
    com.mariageplus: DEBUG
