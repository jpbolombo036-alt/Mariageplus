# Profil local : base H2 en mémoire, migrations Flyway actives, h2-console et debug ouverts.
spring:
  datasource:
    url: jdbc:h2:mem:mariageplus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # validate (et non update) : le schema est gere par Flyway, on evite
      # toute divergence H2/Postgres. Meme comportement que la prod.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: local-mariageplus-secret-key-32bytes-minimum!!
    expiration: 900000
    refresh-expiration: 604800000
  frontend:
    # En local, les liens d'invitation pointent vers le front de dev.
    # (La prod utilise FRONTEND_URL / https://mariaplus-web.vercel.app par défaut.)
    url: ${FRONTEND_URL:http://localhost:3000}
  invitation:
    max-reminders: 3
    reminder-enabled: ${INVITATION_REMINDER_ENABLED:false}
    reminder-days-before: 7
    reminder-cron: 0 0 8 * * *
  whatsapp:
    # Local : non configuré par défaut (l'envoi en masse répond 400 tant que
    # WHATSAPP_TOKEN / WHATSAPP_PHONE_NUMBER_ID ne sont pas définis).
    template-name: invitation_mariage
    template-language: fr
    # Indicatif pays par défaut des invités (RDC : 243).
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:243}
    bulk:
      delay-ms: ${WHATSAPP_BULK_DELAY_MS:200}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8080
  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:true}
    init-email: ${ADMIN_INIT_EMAIL:admin@mariageplus.com}
    init-password: ${ADMIN_INIT_PASSWORD:Admin@12345}

logging:
  level:
    com.mariageplus: DEBUG
