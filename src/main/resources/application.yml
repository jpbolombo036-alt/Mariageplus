spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mariageplusdb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@mariageplus.local}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8000}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    secret: ${JWT_SECRET:please-change-this-mariageplus-secret-key-32-bytes-min}
    expiration: 900000
    refresh-expiration: 604800000

  security:
    require-activation: true
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    admin-init-key: ${ADMIN_INIT_KEY:CHANGE_ME_MARIAGEPLUS}

  rate-limit:
    rsvp:
      window-seconds: ${RSVP_RATE_LIMIT_WINDOW_SECONDS:60}
      read-per-token: ${RSVP_RATE_LIMIT_READ_PER_TOKEN:30}
      submit-per-token: ${RSVP_RATE_LIMIT_SUBMIT_PER_TOKEN:6}
      per-ip: ${RSVP_RATE_LIMIT_PER_IP:120}

  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:}
    init-email: ${ADMIN_INIT_EMAIL:}
    init-password: ${ADMIN_INIT_PASSWORD:}

  frontend:
    url: ${FRONTEND_URL:}

  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
    max-file-size: ${MAX_FILE_SIZE:50MB}

logging:
  level:
    com.mariageplus: ${LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
