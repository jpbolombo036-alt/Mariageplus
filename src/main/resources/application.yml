spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mariageplusdb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@mariageplus.local}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Stockage objet S3-compatible (AWS S3, Cloudflare R2, Backblaze B2, MinIO...)
# Actif uniquement si S3_BUCKET et S3_ACCESS_KEY sont définis — sinon fallback
# automatique sur le stockage en base.
storage:
  s3:
    # Railway (Tigris) injecte automatiquement AWS_S3_* ; S3_* permet un override manuel
    endpoint: ${S3_ENDPOINT:${AWS_S3_ENDPOINT:}}
    region: ${S3_REGION:${AWS_S3_REGION:auto}}
    bucket: ${S3_BUCKET:${AWS_S3_BUCKET:}}
    access-key: ${S3_ACCESS_KEY:${AWS_S3_ACCESS_KEY_ID:}}
    secret-key: ${S3_SECRET_KEY:${AWS_S3_SECRET_ACCESS_KEY:}}
    public-base-url: ${S3_PUBLIC_BASE_URL:}  # optionnel : URL publique du bucket (CDN)

server:
  port: ${PORT:${SERVER_PORT:8000}}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000

  security:
    require-activation: true
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    admin-init-key: ${ADMIN_INIT_KEY:CHANGE_ME_MARIAGEPLUS}

  rate-limit:
    rsvp:
      window-seconds: ${RSVP_RATE_LIMIT_WINDOW_SECONDS:60}
      read-per-token: ${RSVP_RATE_LIMIT_READ_PER_TOKEN:30}
      submit-per-token: ${RSVP_RATE_LIMIT_SUBMIT_PER_TOKEN:6}
      per-ip: ${RSVP_RATE_LIMIT_PER_IP:120}

  invitation:
    max-reminders: ${INVITATION_MAX_REMINDERS:3}
    reminder-enabled: ${INVITATION_REMINDER_ENABLED:false}
    reminder-days-before: ${INVITATION_REMINDER_DAYS_BEFORE:7}
    reminder-cron: ${INVITATION_REMINDER_CRON:0 0 8 * * *}

  whatsapp:
    # Cloud API Meta — actif si WHATSAPP_TOKEN et WHATSAPP_PHONE_NUMBER_ID définis.
    # Sinon l'envoi en masse est refusé (400) et le lien reste partageable à la main.
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    # Base de l'API Graph Meta (surchargeable via WHATSAPP_API_BASE_URL pour les tests).
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:invitation_mariage}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:fr}
    # Indicatif pays par défaut pour normaliser les numéros locaux (ex : 225).
    default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:}
    # URL publique de CETTE API (ex : https://mariageplus-prod.up.railway.app) :
    # sert à exposer /api/events/{id}/image (en-tête du template WhatsApp).
    public-api-base-url: ${PUBLIC_API_BASE_URL:}
    bulk:
      # Cadencement entre deux messages (ms) — 2000 = 30 msg/min.
      delay-ms: ${WHATSAPP_BULK_DELAY_MS:2000}

  event:
    # Cycle de vie automatique des événements passés (désactivé par défaut).
    # Quand la date est dépassée : PUBLISHED -> ACTIVE (jour J), ACTIVE -> COMPLETED.
    autocomplete-enabled: ${EVENT_AUTOCOMPLETE_ENABLED:true}
    autocomplete-cron: ${EVENT_AUTOCOMPLETE_CRON:0 15 0 * * *}

  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:false}
    init-email: ${ADMIN_INIT_EMAIL:}
    init-password: ${ADMIN_INIT_PASSWORD:}

  frontend:
    # URL publique du front web (liens d'invitation email/QR, redirections RSVP).
    # Surchargeable via APP_FRONTEND_URL ou FRONTEND_URL.
    url: ${APP_FRONTEND_URL:${FRONTEND_URL:https://eventiaeasy.vercel.app}}

  public:
    # URL publique de base des liens d'invitation (PRIORITAIRE sur app.frontend.url
    # si définie) — utile si les pages /invitations/{token} sont servies par cette API.
    url: ${APP_PUBLIC_URL:}

  upload:
    dir: ${UPLOAD_DIR:}
    max-file-size: ${MAX_FILE_SIZE:}

logging:
  level:
    com.mariageplus: ${LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
