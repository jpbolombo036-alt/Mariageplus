spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mariageplusdb}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password}}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@mariageplus.local}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Stockage objet S3-compatible (AWS S3, Cloudflare R2, Backblaze B2, MinIO...)
# Actif uniquement si S3_BUCKET et S3_ACCESS_KEY sont définis — sinon fallback
# automatique sur le stockage en base.
storage:
  s3:
    # Railway (Tigris) injecte automatiquement AWS_S3_* ; S3_* permet un override manuel
    endpoint: ${S3_ENDPOINT:${AWS_S3_ENDPOINT:}}
    region: ${S3_REGION:${AWS_S3_REGION:auto}}
    bucket: ${S3_BUCKET:${AWS_S3_BUCKET:}}
    access-key: ${S3_ACCESS_KEY:${AWS_S3_ACCESS_KEY_ID:}}
    secret-key: ${S3_SECRET_KEY:${AWS_S3_SECRET_ACCESS_KEY:}}
    public-base-url: ${S3_PUBLIC_BASE_URL:}  # optionnel : URL publique du bucket (CDN)

server:
  port: ${PORT:${SERVER_PORT:8000}}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000

  security:
    require-activation: true
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-minutes: ${LOCKOUT_DURATION_MINUTES:15}
    admin-init-key: ${ADMIN_INIT_KEY:CHANGE_ME_MARIAGEPLUS}

  rate-limit:
    rsvp:
      window-seconds: ${RSVP_RATE_LIMIT_WINDOW_SECONDS:60}
      read-per-token: ${RSVP_RATE_LIMIT_READ_PER_TOKEN:30}
      submit-per-token: ${RSVP_RATE_LIMIT_SUBMIT_PER_TOKEN:6}
      per-ip: ${RSVP_RATE_LIMIT_PER_IP:120}

  invitation:
    max-reminders: ${INVITATION_MAX_REMINDERS:3}
    reminder-enabled: ${INVITATION_REMINDER_ENABLED:false}
    reminder-days-before: ${INVITATION_REMINDER_DAYS_BEFORE:7}
    reminder-cron: ${INVITATION_REMINDER_CRON:0 0 8 * * *}

  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:false}
    init-email: ${ADMIN_INIT_EMAIL:}
    init-password: ${ADMIN_INIT_PASSWORD:}

  frontend:
    # URL publique du front web (liens d'invitation email/QR, redirections RSVP).
    # Surchargeable via la variable d'environnement FRONTEND_URL.
    url: ${FRONTEND_URL:https://mariaplus-web.vercel.app}

  upload:
    dir: ${UPLOAD_DIR:}
    max-file-size: ${MAX_FILE_SIZE:}

logging:
  level:
    com.mariageplus: ${LOG_LEVEL:INFO}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
