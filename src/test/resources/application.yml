spring:
  datasource:
    url: jdbc:h2:mem:mariageplus_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 2525

app:
  jwt:
    secret: test-mariageplus-jwt-secret-key-32bytes-minimum
    expiration: 86400000
    refresh-expiration: 604800000
  cors:
    allowed-origins: http://localhost:3000
  admin:
    init-enabled: true
    init-email: admin@test.mariageplus.app
    init-password: Admin@12345
  frontend:
    url: http://localhost:3000
  security:
    require-activation: false
    admin-init-key: test-admin-init-key
  invitation:
    reminder-enabled: false
    reminder-days-before: 7
    reminder-cron: 0 0 0 1 1 *  # jamais exécuté en test
    max-reminders: 3

logging:
  level:
    com.mariageplus: WARN
    org.springframework: WARN
